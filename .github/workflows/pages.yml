name: Deploy the live extension pages to GitHub Pages

# The site is built locally by scripts/build-pages.sh (just pages) and
# committed under pages/; this only publishes that folder (nothing is
# built here).

on:
  push:
    branches: [main]
    paths: ["pages/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload the pages folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages
      # GitHub sometimes cannot find the artifact just uploaded ("No
      # artifacts named github-pages were found"): wait and try once more
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait before trying again
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - name: Deploy to GitHub Pages, again
        id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
