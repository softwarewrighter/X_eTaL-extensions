name: Deploy the live extension pages to GitHub Pages

# The site is built locally by scripts/build-pages.sh (just pages) and
# committed under pages/; this only publishes that folder (nothing is
# built here).

on:
  push:
    branches: [main]
    paths: ["pages/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload the pages folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
