# This repo's crates and extensions. X_eTaL's clone (work/xetal/, built by
# scripts/xetal.sh)
# keeps its own workspaces and is never a member.
[workspace]
members = ["crates/*", "extensions/*/rust"]
resolver = "3"
# The live pages (web/, extensions/*/web/) are workspaces of their own:
# they link extensions with the `static` feature.
exclude = ["work", "web", "extensions/*/web"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"
authors = ["Michael A Wright"]

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
