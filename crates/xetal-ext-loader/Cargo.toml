[package]
name = "xetal-ext-loader"
version = "0.1.0"
description = "Finds, loads, validates and calls X_eTaL native extensions"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
libloading = { version = "0.8", optional = true }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
xetal-ext-abi = { path = "../xetal-ext-abi" }

[features]
# Loading shared libraries (not in a browser: wasm32 has none).
default = ["dynamic"]
dynamic = ["dep:libloading"]

[dev-dependencies]
xetal-ext-hello = { path = "../../extensions/hello/rust" }

[lints]
workspace = true
