[package]
name = "xetal-x"
version = "0.1.0"
description = "The X_eTaL bridge host: the vendored xetal CLI with native extensions behind ext: paths"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true

[[bin]]
name = "xetal-x"
path = "src/main.rs"

# X_eTaL's crates, from its clone at XETAL_COMMIT (work/xetal/, never
# edited): the command line as a library (ask E3, landed) and what its
# binary's main uses.
[dependencies]
xetal-command = { path = "../../work/xetal/components/cli/crates/xetal-command" }
xetal-shell = { path = "../../work/xetal/components/cli/crates/xetal-shell" }
xetal-repl = { path = "../../work/xetal/components/cli/crates/xetal-repl" }
xetal-base = { path = "../../work/xetal/components/base/crates/xetal-base" }
xetal-store = { path = "../../work/xetal/components/base/crates/xetal-store" }
xetal-edit = { path = "../../work/xetal/components/tui/crates/xetal-edit" }
xetal-keys = { path = "../../work/xetal/components/tui/crates/xetal-keys" }
xetal-grid = { path = "../../work/xetal/components/view/crates/xetal-grid" }
xetal-line = { path = "../../work/xetal/components/line/crates/xetal-line" }
xetal-tty = { path = "../../work/xetal/components/console/crates/xetal-tty" }
xetal-system = { path = "../../work/xetal/components/system/crates/xetal-system" }
clap = { version = "4", features = ["derive"] }
sigpipe = "0.1.3"
xetal-ext-loader = { path = "../xetal-ext-loader" }
xetal-ext-bridge = { path = "../xetal-ext-bridge" }
xetal-ext-ui = { path = "../xetal-ext-ui" }
# Extensions linked into this host (their windows need its main thread).
xetal-ext-canvas = { path = "../../extensions/canvas/rust", features = ["static"] }
xetal-ext-scene = { path = "../../extensions/scene/rust", features = ["static"] }

[dev-dependencies]
xetal-ext-hello = { path = "../../extensions/hello/rust" }
