[package]
name = "xetal-x"
version = "0.1.0"
description = "The X_eTaL bridge host: the vendored xetal CLI with native extensions behind ext: paths"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true

[[bin]]
name = "xetal-x"
path = "src/main.rs"

# The vendored X_eTaL crates the CLI uses (vendor/xetal/, never edited).
[dependencies]
xetal-base = { path = "../../vendor/xetal/components/base/crates/xetal-base" }
xetal-lex = { path = "../../vendor/xetal/components/syntax/crates/xetal-lex" }
xetal-render = { path = "../../vendor/xetal/components/render/crates/xetal-render" }
xetal-view = { path = "../../vendor/xetal/components/view/crates/xetal-view" }
xetal-edit = { path = "../../vendor/xetal/components/tui/crates/xetal-edit" }
xetal-syntax = { path = "../../vendor/xetal/components/syntax/crates/xetal-syntax" }
xetal-core = { path = "../../vendor/xetal/components/core/crates/xetal-core" }
xetal-types = { path = "../../vendor/xetal/components/types/crates/xetal-types" }
xetal-eval = { path = "../../vendor/xetal/components/eval/crates/xetal-eval" }
xetal-repl = { path = "../../vendor/xetal/components/cli/crates/xetal-repl" }
xetal-program = { path = "../../vendor/xetal/components/macro/crates/xetal-program" }
xetal-lint = { path = "../../vendor/xetal/components/core/crates/xetal-lint" }
xetal-sources = { path = "../../vendor/xetal/components/macro/crates/xetal-sources" }
xetal-diagram = { path = "../../vendor/xetal/components/view/crates/xetal-diagram" }
xetal-store = { path = "../../vendor/xetal/components/base/crates/xetal-store" }
xetal-grid = { path = "../../vendor/xetal/components/view/crates/xetal-grid" }
clap = { version = "4", features = ["derive"] }
sigpipe = "0.1.3"
xetal-ext-loader = { path = "../xetal-ext-loader" }
xetal-ext-bridge = { path = "../xetal-ext-bridge" }
xetal-ext-ui = { path = "../xetal-ext-ui" }
# Extensions linked into this host (their windows need its main thread).
xetal-ext-canvas = { path = "../../extensions/canvas/rust", features = ["static"] }
xetal-ext-scene = { path = "../../extensions/scene/rust", features = ["static"] }

[dev-dependencies]
xetal-ext-hello = { path = "../../extensions/hello/rust" }
