[package]
name = "xetal-ext-audio"
version = "0.1.0"
description = "audio files: decode Ogg Vorbis, MP3 and WAV, play them, and read what is playing as arrays"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true

[lib]
name = "xetal_ext_audio"
crate-type = ["cdylib", "rlib"]

[dependencies]
xetal-ext-sdk = { path = "../../../crates/xetal-ext-sdk" }
# Decoding (pure Rust; Ogg Vorbis first, plan M6) and the sound device.
symphonia = { version = "0.5", default-features = false, features = ["ogg", "vorbis", "mp3", "wav", "pcm"] }
cpal = "0.15"

[features]
# Link statically beside other extensions (a browser page): no unmangled
# entry point. Never enabled inside the root workspace.
static = []

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
