[package]
name = "xetal-ext-blender"
version = "0.1.0"
description = "Blender 3D in batch: run Python that runs Blender"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true

[lib]
name = "xetal_ext_blender"
crate-type = ["cdylib", "rlib"]

[dependencies]
xetal-ext-sdk = { path = "../../../crates/xetal-ext-sdk" }

[features]
# Link statically beside other extensions (a browser page): no unmangled
# entry point. Never enabled inside the root workspace.
static = []

[lints]
workspace = true
