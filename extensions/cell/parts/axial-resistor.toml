# An axial resistor, 1/4 W: a cylinder along x, a lead out of each end.
# Its value is an instance's (the bands are drawn from it).
kind = "axial-resistor"
title = "axial resistor, 1/4 W"
example = "10 kilohm"
heat_sensitive = false
semiconductor = false

[body]
shape = "cylinder"
diameter = 2.3
length = 6.0
axis = "x"
material = "ceramic"

[[pin]]
name = "1"
lead = [[-3.0, 0, 0], [-31.0, 0, 0]]
diameter = 0.6
material = "copper"

[[pin]]
name = "2"
lead = [[3.0, 0, 0], [31.0, 0, 0]]
diameter = 0.6
material = "copper"

[[grasp]]
name = "body"
at = [0, 0, 0]
rpy = [0, 0, 90]
width = 2.3

[[grasp]]
name = "lead1"
at = [-8.0, 0, 0]
rpy = [0, 0, 90]
width = 0.6

[[grasp]]
name = "lead2"
at = [8.0, 0, 0]
rpy = [0, 0, 90]
width = 0.6

[thermal]
mass_g = 0.25
heat_capacity_j_per_k = 0.2
body_limit_c = 260
body_limit_s = 10
sourced = ["body_limit_c", "body_limit_s"]
source = "IEC 60068-2-20 (resistance to soldering heat): 260 C for 10 s, the rating leaded parts commonly carry"
illustrative = ["mass_g", "heat_capacity_j_per_k"]
