# A ground-plane tile for Manhattan-style building (decision C24): copper
# clad board 38 by 18 mm, its top the ground plane, with ten copper
# turret posts 5 mm tall in two rows of five, 7.62 mm apart along a row
# and the rows 10.16 mm apart (room between the parts standing on it). Posts 1 and
# 6 stand on the plane itself (one conductor: `common`); the other eight
# stand on small pads glued to it and are each their own node, one a net.
# Units: mm, degrees, grams, J/K, C, s. The body's center is the origin,
# Z up, the posts up (as it lies in a tray).
kind = "manhattan-tile"
title = "Manhattan ground-plane tile"
example = "copper-clad FR-4, ten turret posts"
heat_sensitive = false
semiconductor = false
common = ["1", "6"]

[body]
shape = "box"
size = [38.0, 18.0, 1.6]
material = "fr4"

[[pin]]
name = "1"
role = "GND"
lead = [[-15.24, 5.08, 0.8], [-15.24, 5.08, 5.8]]
diameter = 1.0
material = "copper"

[[pin]]
name = "2"
role = "pad"
lead = [[-7.62, 5.08, 0.8], [-7.62, 5.08, 5.8]]
diameter = 1.0
material = "copper"

[[pin]]
name = "3"
role = "pad"
lead = [[0, 5.08, 0.8], [0, 5.08, 5.8]]
diameter = 1.0
material = "copper"

[[pin]]
name = "4"
role = "pad"
lead = [[7.62, 5.08, 0.8], [7.62, 5.08, 5.8]]
diameter = 1.0
material = "copper"

[[pin]]
