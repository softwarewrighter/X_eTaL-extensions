lead = [[15.24, 5.08, 0.8], [15.24, 5.08, 5.8]]
diameter = 1.0
material = "copper"

[[pin]]
name = "6"
role = "GND"
lead = [[-15.24, -5.08, 0.8], [-15.24, -5.08, 5.8]]
diameter = 1.0
material = "copper"

[[pin]]
name = "7"
