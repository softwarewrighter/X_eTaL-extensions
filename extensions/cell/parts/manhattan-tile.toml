# Jaws close along the grasp frame's x, approaching along its -z: across
# the tile's width, at its middle.
[[grasp]]
name = "body"
at = [0, 0, 0]
rpy = [0, 0, 90]
width = 18.0

[thermal]
mass_g = 2.0
heat_capacity_j_per_k = 1.6
body_limit_c = 300
body_limit_s = 60
illustrative = ["mass_g", "heat_capacity_j_per_k", "body_limit_c", "body_limit_s"]
