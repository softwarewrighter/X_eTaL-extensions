# A ground-plane tile for Manhattan-style building (decision C24): copper
# clad board 26 by 16 mm, its top the ground plane, with ten copper
# turret posts 5 mm tall in two rows of five, 5.08 mm apart. Posts 1 and
# 6 stand on the plane itself (one conductor: `common`); the other eight
# stand on small pads glued to it and are each their own node, one a net.
# Units: mm, degrees, grams, J/K, C, s. The body's center is the origin,
# Z up, the posts up (as it lies in a tray).
kind = "manhattan-tile"
title = "Manhattan ground-plane tile"
example = "copper-clad FR-4, ten turret posts"
heat_sensitive = false
semiconductor = false
common = ["1", "6"]

[body]
shape = "box"
size = [26.0, 16.0, 1.6]
material = "fr4"

[[pin]]
name = "1"
role = "GND"
lead = [[-10.16, 3.81, 0.8], [-10.16, 3.81, 5.8]]
diameter = 1.0
material = "copper"

[[pin]]
name = "2"
role = "pad"
lead = [[-5.08, 3.81, 0.8], [-5.08, 3.81, 5.8]]
diameter = 1.0
material = "copper"

[[pin]]
name = "3"
role = "pad"
lead = [[0, 3.81, 0.8], [0, 3.81, 5.8]]
diameter = 1.0
material = "copper"

[[pin]]
name = "4"
role = "pad"
lead = [[5.08, 3.81, 0.8], [5.08, 3.81, 5.8]]
diameter = 1.0
material = "copper"

[[pin]]
name = "5"
role = "pad"
lead = [[10.16, 3.81, 0.8], [10.16, 3.81, 5.8]]
diameter = 1.0
material = "copper"

[[pin]]
name = "6"
role = "GND"
lead = [[-10.16, -3.81, 0.8], [-10.16, -3.81, 5.8]]
diameter = 1.0
material = "copper"

[[pin]]
name = "7"
role = "pad"
lead = [[-5.08, -3.81, 0.8], [-5.08, -3.81, 5.8]]
diameter = 1.0
material = "copper"

[[pin]]
name = "8"
role = "pad"
lead = [[0, -3.81, 0.8], [0, -3.81, 5.8]]
diameter = 1.0
material = "copper"

[[pin]]
name = "9"
role = "pad"
lead = [[5.08, -3.81, 0.8], [5.08, -3.81, 5.8]]
diameter = 1.0
material = "copper"

[[pin]]
name = "10"
role = "pad"
lead = [[10.16, -3.81, 0.8], [10.16, -3.81, 5.8]]
diameter = 1.0
material = "copper"

# Jaws close along the grasp frame's x, approaching along its -z: across
# the tile's width, at its middle.
[[grasp]]
name = "body"
at = [0, 0, 0]
rpy = [0, 0, 90]
width = 16.0

[thermal]
mass_g = 2.0
heat_capacity_j_per_k = 1.6
body_limit_c = 300
body_limit_s = 60
illustrative = ["mass_g", "heat_capacity_j_per_k", "body_limit_c", "body_limit_s"]
