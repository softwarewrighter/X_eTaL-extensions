# TO-92: a molded D-shaped body, three leads in a line, 1.27 mm apart.
# Pins 1, 2, 3 left to right with the flat face toward you (-y) and the
# leads down; for the 2N3904 that is emitter, base, collector.
# Heat sensitive: clip a heatsink between the body and the joint.
kind = "to92"
title = "TO-92"
example = "2N3904 NPN transistor"
heat_sensitive = true
semiconductor = true

[body]
shape = "d_cylinder"
diameter = 4.8
length = 4.8
axis = "z"
flat = 1.4
material = "epoxy"

[[pin]]
name = "1"
role = "E"
lead = [[-1.27, 0, -2.4], [-1.27, 0, -15.1]]
diameter = 0.45
material = "copper"

[[pin]]
name = "2"
role = "B"
lead = [[0, 0, -2.4], [0, 0, -15.1]]
diameter = 0.45
material = "copper"

[[pin]]
name = "3"
role = "C"
lead = [[1.27, 0, -2.4], [1.27, 0, -15.1]]
diameter = 0.45
material = "copper"

[[grasp]]
name = "body"
at = [0, 0, 0]
rpy = [0, 0, 90]
width = 3.8

[thermal]
mass_g = 0.2
heat_capacity_j_per_k = 0.2
body_limit_c = 260
body_limit_s = 10
sourced = ["body_limit_c", "body_limit_s"]
source = "IEC 60068-2-20 (resistance to soldering heat): 260 C for 10 s, the rating leaded parts commonly carry"
illustrative = ["mass_g", "heat_capacity_j_per_k"]
