[package]
name = "xetal-ext-linalg"
version = "0.1.0"
description = "Linear algebra: solve, inverse, determinant, least squares, eigenvalues, SVD"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true

[lib]
name = "xetal_ext_linalg"
crate-type = ["cdylib", "rlib"]

[dependencies]
xetal-ext-sdk = { path = "../../../crates/xetal-ext-sdk" }
nalgebra = { version = "0.33", default-features = false, features = ["std"] }

[features]
# Link statically beside other extensions (a browser page): no unmangled
# entry point. Never enabled inside the root workspace.
static = []

[lints]
workspace = true

[dev-dependencies]
xetal-ext-loader = { path = "../../../crates/xetal-ext-loader" }
