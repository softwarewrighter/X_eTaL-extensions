# The sqlite package: what the loader reads to find and check the
# native library, and the facade programs import.
[extension]
name = "sqlite"
version = "0.1.0"
abi = 1
facade = "lib/Sqlite.xtl"
# The library's file stem: libxetal_ext_sqlite.dylib on macOS, .so on Linux.
library = "xetal_ext_sqlite"
