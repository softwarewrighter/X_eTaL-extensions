# The machines of the render farm (scripts/farm.py; docs/farm.md).
# A table a machine, named by its host name (`hostname -s`), in the
# order frames are given out:
#   speed    how fast it renders against the others (frames and items
#            are divided in proportion): 1 / the seconds `just
#            farm-bench` reports, scaled so the slowest is 1.0
#   vram     its graphics card's memory in GB (a job may ask for some)
#   on       false for a machine that is not taking part (it gets nothing)
#   ssh      how the others reach it for `farm collect` (its name, if not given)
#   path     where this repository is on it (~/github/softwarewrighter/X_eTaL-extensions, if not given)
#   blender  its Blender, if not `blender` on PATH
# large12's, beast48's and max's speeds are measured: the city film's
# frames took 29, 66 and about 120 seconds on them (2026-11-16). big72's
# and queenbee's are guesses from the cards' names; super's from max's.

[hosts.large12]
card = "RTX 5060 16 GB"
speed = 2.3
vram = 16
path = "/disk1/github/softwarewrighter/X_eTaL-extensions"

[hosts.beast48]
card = "RTX 3060 12 GB"
speed = 1.0
vram = 12
path = "/data2/github/softwarewrighter/X_eTaL-extensions"

# The Mac (M1 Max, Metal): slower than the cards.
# Its Blender 5.3.0 is beside the 5.1.2 the extension's goldens name.
[hosts.max]
card = "Apple M1 Max"
speed = 0.55
vram = 32
blender = "/Applications/Blender-5.3/Blender.app/Contents/MacOS/Blender"

# off 2026-11-16: it does not boot (a memory fault); on again when it is repaired
[hosts.big72]
card = "RTX 3060 12 GB"
speed = 1.0
vram = 12
on = false

# always on from 2026-11-24 (the user); its speed is still a guess:
# run `just farm bench` on it
[hosts.queenbee]
card = "RTX 3090 24 GB"
speed = 2.3
vram = 24

# The Mac Studio (M1 Ultra, 64 GB unified memory, Metal), always on from
# 2026-11-24 but not yet set up (no git, Rust, uv, just or Blender): on
# when `just farm check` passes there. speed is a guess (about twice
# max's GPU); vram is the part of the unified memory Metal lets the GPU
# use (about three quarters). blender: set it if Blender is not on PATH.
[hosts.super]
card = "Apple M1 Ultra"
speed = 1.1
vram = 48
on = false
