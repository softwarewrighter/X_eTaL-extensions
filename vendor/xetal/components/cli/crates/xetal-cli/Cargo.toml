[package]
name = "xetal-cli"
description = "The `xetal` command-line interface"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "xetal"
path = "src/main.rs"

[dependencies]
xetal-base.workspace = true
xetal-lex.workspace = true
xetal-render.workspace = true
xetal-view.workspace = true
xetal-edit.workspace = true
xetal-syntax.workspace = true
xetal-core.workspace = true
xetal-types.workspace = true
xetal-eval.workspace = true
xetal-repl.workspace = true
xetal-program.workspace = true
xetal-lint.workspace = true
xetal-sources.workspace = true
xetal-diagram.workspace = true
xetal-store.workspace = true
xetal-grid.workspace = true
clap.workspace = true
sigpipe = "0.1.3"

[dev-dependencies]
xetal-spec.workspace = true

[build-dependencies]
hostname = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
