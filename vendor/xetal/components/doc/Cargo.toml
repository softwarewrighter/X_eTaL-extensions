# X_eTaL component `doc`: one Cargo workspace (see docs/architecture.md).

[workspace]
resolver = "3"
members = [
    "crates/xetal-doccom",
    "crates/xetal-doc",
    "crates/xetal-doclink",
    "crates/xetal-dochtml",
    "crates/xetal-docsite",
    "crates/xetal-doctest",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Michael A Wright"]
repository = "https://github.com/softwarewrighter/X_eTaL"

[workspace.dependencies]
xetal-catalog = { path = "../base/crates/xetal-catalog" }
xetal-ast = { path = "../syntax/crates/xetal-ast" }
xetal-ir = { path = "../core/crates/xetal-ir" }
xetal-lint = { path = "../core/crates/xetal-lint" }
xetal-base = { path = "../base/crates/xetal-base" }
xetal-lex = { path = "../syntax/crates/xetal-lex" }
xetal-syntax = { path = "../syntax/crates/xetal-syntax" }
xetal-render = { path = "../render/crates/xetal-render" }
xetal-core = { path = "../core/crates/xetal-core" }
xetal-ty = { path = "../types/crates/xetal-ty" }
xetal-types = { path = "../types/crates/xetal-types" }
xetal-array = { path = "../eval/crates/xetal-array" }
xetal-value = { path = "../eval/crates/xetal-value" }
xetal-arith = { path = "../eval/crates/xetal-arith" }
xetal-search = { path = "../search/crates/xetal-search" }
xetal-radix = { path = "../radix/crates/xetal-radix" }
xetal-doccom = { path = "crates/xetal-doccom" }
xetal-doc = { path = "crates/xetal-doc" }
xetal-doclink = { path = "crates/xetal-doclink" }
xetal-dochtml = { path = "crates/xetal-dochtml" }
xetal-docsite = { path = "crates/xetal-docsite" }
xetal-view = { path = "../view/crates/xetal-view" }
xetal-doctest = { path = "crates/xetal-doctest" }
xetal-repl = { path = "../cli/crates/xetal-repl" }
xetal-store = { path = "../base/crates/xetal-store" }
xetal-program = { path = "../macro/crates/xetal-program" }
xetal-sources = { path = "../macro/crates/xetal-sources" }
xetal-names = { path = "../macro/crates/xetal-names" }
xetal-libs = { path = "../macro/crates/xetal-libs" }
xetal-macro = { path = "../macro/crates/xetal-macro" }
xetal-eval = { path = "../eval/crates/xetal-eval" }
xetal-spec = { path = "../cli/crates/xetal-spec" }
clap = { version = "4", features = ["derive"] }
assert_cmd = "2"
proptest = "1"
predicates = "3"
