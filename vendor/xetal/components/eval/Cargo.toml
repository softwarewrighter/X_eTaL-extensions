# X_eTaL component `eval`: one Cargo workspace (see docs/architecture.md).

[workspace]
resolver = "3"
members = ["crates/xetal-array", "crates/xetal-value", "crates/xetal-arith", "crates/xetal-struct", "crates/xetal-eval"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Michael A Wright"]
repository = "https://github.com/softwarewrighter/X_eTaL"

[workspace.dependencies]
xetal-catalog = { path = "../base/crates/xetal-catalog" }
xetal-ast = { path = "../syntax/crates/xetal-ast" }
xetal-ir = { path = "../core/crates/xetal-ir" }
xetal-lint = { path = "../core/crates/xetal-lint" }
xetal-base = { path = "../base/crates/xetal-base" }
xetal-lex = { path = "../syntax/crates/xetal-lex" }
xetal-syntax = { path = "../syntax/crates/xetal-syntax" }
xetal-render = { path = "../render/crates/xetal-render" }
xetal-core = { path = "../core/crates/xetal-core" }
xetal-ty = { path = "../types/crates/xetal-ty" }
xetal-types = { path = "../types/crates/xetal-types" }
xetal-array = { path = "crates/xetal-array" }
xetal-value = { path = "crates/xetal-value" }
xetal-arith = { path = "crates/xetal-arith" }
xetal-struct = { path = "crates/xetal-struct" }
xetal-hof = { path = "../hof/crates/xetal-hof" }
xetal-search = { path = "../search/crates/xetal-search" }
xetal-radix = { path = "../radix/crates/xetal-radix" }
xetal-system = { path = "../system/crates/xetal-system" }
xetal-rotate = { path = "../axes/crates/xetal-rotate" }
xetal-grid = { path = "../view/crates/xetal-grid" }
xetal-eval = { path = "crates/xetal-eval" }
xetal-spec = { path = "../cli/crates/xetal-spec" }
clap = { version = "4", features = ["derive"] }
assert_cmd = "2"
proptest = "1"
predicates = "3"
