# X_eTaL component `macro`: one Cargo workspace (see docs/architecture.md).

[workspace]
resolver = "3"
members = ["crates/xetal-sources", "crates/xetal-macro", "crates/xetal-libs", "crates/xetal-names", "crates/xetal-program"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Michael A Wright"]
repository = "https://github.com/softwarewrighter/X_eTaL"

[workspace.dependencies]
xetal-base = { path = "../base/crates/xetal-base" }
xetal-lex = { path = "../syntax/crates/xetal-lex" }
xetal-sources = { path = "crates/xetal-sources" }
xetal-macro = { path = "crates/xetal-macro" }
xetal-libs = { path = "crates/xetal-libs" }
xetal-store = { path = "../base/crates/xetal-store" }
xetal-names = { path = "crates/xetal-names" }
xetal-program = { path = "crates/xetal-program" }
proptest = "1"
xetal-core = { path = "../core/crates/xetal-core" }
xetal-types = { path = "../types/crates/xetal-types" }
xetal-eval = { path = "../eval/crates/xetal-eval" }
