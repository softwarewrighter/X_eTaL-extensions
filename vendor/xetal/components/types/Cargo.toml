# X_eTaL component `types`: one Cargo workspace (see docs/architecture.md).

[workspace]
resolver = "3"
members = ["crates/xetal-ty", "crates/xetal-prim-types", "crates/xetal-elab", "crates/xetal-types"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Michael A Wright"]
repository = "https://github.com/softwarewrighter/X_eTaL"

[workspace.dependencies]
xetal-catalog = { path = "../base/crates/xetal-catalog" }
xetal-ast = { path = "../syntax/crates/xetal-ast" }
xetal-ir = { path = "../core/crates/xetal-ir" }
xetal-lint = { path = "../core/crates/xetal-lint" }
xetal-base = { path = "../base/crates/xetal-base" }
xetal-lex = { path = "../syntax/crates/xetal-lex" }
xetal-syntax = { path = "../syntax/crates/xetal-syntax" }
xetal-render = { path = "../render/crates/xetal-render" }
xetal-core = { path = "../core/crates/xetal-core" }
xetal-ty = { path = "crates/xetal-ty" }
xetal-types = { path = "crates/xetal-types" }
xetal-prim-types = { path = "crates/xetal-prim-types" }
xetal-elab = { path = "crates/xetal-elab" }
xetal-array = { path = "../eval/crates/xetal-array" }
xetal-eval = { path = "../eval/crates/xetal-eval" }
xetal-spec = { path = "../cli/crates/xetal-spec" }
clap = { version = "4", features = ["derive"] }
assert_cmd = "2"
proptest = "1"
predicates = "3"
