# X_eTaL component `web`: one Cargo workspace (see docs/architecture.md).

[workspace]
resolver = "3"
members = ["crates/xetal-play", "crates/xetal-chrome", "crates/xetal-layout", "crates/xetal-runner", "crates/xetal-web", "crates/xetal-typing"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Michael A Wright"]
repository = "https://github.com/softwarewrighter/X_eTaL"

[workspace.dependencies]
xetal-tty = { path = "../console/crates/xetal-tty" }
xetal-typing = { path = "crates/xetal-typing" }
xetal-step = { path = "../step/crates/xetal-step" }
xetal-screen = { path = "../console/crates/xetal-screen" }
xetal-lineedit = { path = "../console/crates/xetal-lineedit" }
xetal-catalog = { path = "../base/crates/xetal-catalog" }
xetal-ast = { path = "../syntax/crates/xetal-ast" }
xetal-ir = { path = "../core/crates/xetal-ir" }
xetal-lint = { path = "../core/crates/xetal-lint" }
xetal-base = { path = "../base/crates/xetal-base" }
xetal-lex = { path = "../syntax/crates/xetal-lex" }
xetal-syntax = { path = "../syntax/crates/xetal-syntax" }
xetal-render = { path = "../render/crates/xetal-render" }
xetal-core = { path = "../core/crates/xetal-core" }
xetal-ty = { path = "../types/crates/xetal-ty" }
xetal-types = { path = "../types/crates/xetal-types" }
xetal-array = { path = "../eval/crates/xetal-array" }
xetal-value = { path = "../eval/crates/xetal-value" }
xetal-arith = { path = "../eval/crates/xetal-arith" }
xetal-system = { path = "../system/crates/xetal-system" }
xetal-play = { path = "crates/xetal-play" }
xetal-chrome = { path = "crates/xetal-chrome" }
xetal-layout = { path = "crates/xetal-layout" }
xetal-runner = { path = "crates/xetal-runner" }
xetal-libs = { path = "../macro/crates/xetal-libs" }
xetal-store = { path = "../base/crates/xetal-store" }
xetal-eval = { path = "../eval/crates/xetal-eval" }
xetal-spec = { path = "../cli/crates/xetal-spec" }
clap = { version = "4", features = ["derive"] }
assert_cmd = "2"
proptest = "1"
predicates = "3"
xetal-view = { path = "../view/crates/xetal-view" }
xetal-grid = { path = "../view/crates/xetal-grid" }
xetal-program = { path = "../macro/crates/xetal-program" }
xetal-macro = { path = "../macro/crates/xetal-macro" }
yew = { version = "0.21", features = ["csr"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Element", "HtmlElement", "Document", "NodeList", "HtmlTextAreaElement", "KeyboardEvent", "Window", "Storage", "PointerEvent", "DomRect", "DedicatedWorkerGlobalScope", "MessageEvent", "Worker", "ErrorEvent"] }
console_error_panic_hook = "0.1"
